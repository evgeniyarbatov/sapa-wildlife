<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sa Pa Wildlife</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
  :root {
    --bg: #f7f6f2;
    --panel: #ffffff;
    --text: #1c1b18;
    --muted: #6b6a63;
    --border: #e4e2da;
    --accent: #2f6b3a;
    --accent-weak: #e7f0e6;
    --chip: #efece2;
    --link: #1d5da0;
    --shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16160f;
      --panel: #1e1d17;
      --text: #ece9df;
      --muted: #a6a394;
      --border: #34322a;
      --accent: #7fc98c;
      --accent-weak: #223324;
      --chip: #2a291f;
      --link: #7db8e8;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16160f;
    --panel: #1e1d17;
    --text: #ece9df;
    --muted: #a6a394;
    --border: #34322a;
    --accent: #7fc98c;
    --accent-weak: #223324;
    --chip: #2a291f;
    --link: #7db8e8;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 28px 20px 16px;
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .source-link {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    text-decoration: none;
  }
  .source-link:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }
  .select-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
  }
  .select-wrap::after {
    content: '';
    position: absolute;
    right: 16px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  .toolbar select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    padding: 12px 40px 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .toolbar select:hover { border-color: var(--accent); }
  .toolbar select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak);
  }
  .count {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .view-toggle {
    display: inline-flex;
    flex: 0 0 auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  .view-toggle button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px 14px;
    cursor: pointer;
  }
  .view-toggle button + button { border-left: 1px solid var(--border); }
  .view-toggle button:hover { color: var(--text); }
  .view-toggle button.active {
    background: var(--accent-weak);
    color: var(--accent);
  }

  .map-wrap {
    height: min(72vh, 720px);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  @media (max-width: 700px) {
    .select-wrap { flex: 1 1 100%; }
    .map-wrap { height: min(62vh, 560px); }
    .leaflet-popup-content img { width: 120px; height: 120px; }
  }
  #map { width: 100%; height: 100%; }
  .map-legend {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.78rem;
    box-shadow: var(--shadow);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .map-legend i {
    display: inline-block;
    width: 14px;
    height: 3px;
    border-radius: 2px;
    vertical-align: middle;
    margin-right: 5px;
  }
  .map-legend i.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  .leaflet-popup-content { margin: 10px 12px; }
  .leaflet-popup-content img {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    margin-bottom: 8px;
    background: var(--chip);
  }
  .popup-name { font-size: 0.86rem; margin-bottom: 4px; }
  .leaflet-bar a {
    background: var(--panel);
    color: var(--text);
    border-bottom-color: var(--border);
  }
  .leaflet-bar a:hover { background: var(--accent-weak); }
  .leaflet-control-attribution {
    background: var(--panel);
    color: var(--muted);
  }
  .marker-cluster {
    background: color-mix(in srgb, var(--accent) 28%, transparent);
    border-radius: 50%;
  }
  .marker-cluster div {
    background: var(--accent);
    color: var(--bg);
    width: 30px;
    height: 30px;
    margin: 5px;
    border-radius: 50%;
    font-weight: 700;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    color: var(--muted);
    font-weight: 600;
    user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th .arrow { opacity: 0.5; margin-left: 4px; font-size: 0.75em; }
  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    max-width: 480px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--accent-weak); }

  .thumb {
    width: 400px;
    height: 400px;
    border-radius: 8px;
    object-fit: cover;
    display: block;
    background: var(--chip);
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .chip {
    display: inline-block;
    background: var(--chip);
    color: var(--text);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .sci { font-style: italic; color: var(--muted); }
  .empty {
    padding: 40px 12px;
    text-align: center;
    color: var(--muted);
  }
  footer {
    max-width: 1100px;
    margin: 30px auto 0;
    padding: 0 20px 40px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  footer a { color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Sa Pa Wildlife</h1>
    <p>iNaturalist observations along the route for the Vietnam Mountain Marathon 100-miler.</p>
  </div>
  <a class="source-link" href="https://github.com/evgeniyarbatov/sapa-wildlife" target="_blank" rel="noopener">Source ↗</a>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="select-wrap">
      <select id="groupFilter"><option value="">All groups</option></select>
    </div>
    <div class="view-toggle" role="group" aria-label="View">
      <button type="button" id="viewTable" class="active" aria-pressed="true">Table</button>
      <button type="button" id="viewMap" aria-pressed="false">Map</button>
    </div>
    <span class="count" id="count"></span>
  </div>

  <div class="table-scroll" id="tableView">
    <table id="table">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No rows match.</div>
  </div>
  <div class="map-wrap" id="mapView" hidden>
    <div id="map"></div>
  </div>
</div>

<footer>
  Data: observations pulled from <a href="https://www.inaturalist.org" target="_blank" rel="noopener">iNaturalist</a> (contributor-licensed — check per-observation licences before reuse).
  Source: <a href="https://github.com/evgeniyarbatov/sapa-wildlife" target="_blank" rel="noopener">sapa-wildlife</a>.
</footer>

<script>
const CONFIG = {
  url: 'data/vmm_observations.csv',
  gpx: 'gpx/vietnam-mountain-marathon-2024-ultra-100-miles.gpx',
  columns: ['photo_url','common_name','obs_url'],
  labels: { photo_url: '', common_name: 'Name', obs_url: 'Link' },
  render: {
    photo_url: v => v ? `<img class="thumb" src="${esc(v)}" loading="lazy" alt="">` : '',
    common_name: (v, r) => v
      ? `${esc(capitalize(v))}${r.scientific_name ? ` <span class="sci">(${esc(r.scientific_name)})</span>` : ''}`
      : `<span class="sci">${esc(r.scientific_name)}</span>`,
    obs_url: v => v ? `<a href="${esc(v)}" target="_blank" rel="noopener">iNaturalist ↗</a>` : '',
  },
  defaultSort: { col: 'common_name', dir: 'asc' },
};

let rows = [];
let sortState = { ...CONFIG.defaultSort };
let view = 'table';
let map, markersLayer, routeLatLngs, mapReady;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function dedupeByName(data) {
  const latest = new Map();
  for (const r of data) {
    const key = r.scientific_name || r.common_name;
    const prev = latest.get(key);
    if (!prev || (r.observed_on || '') > (prev.observed_on || '')) {
      latest.set(key, r);
    }
  }
  return [...latest.values()];
}

async function loadDataset() {
  const res = await fetch(CONFIG.url);
  const text = await res.text();
  const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
  return dedupeByName(parsed.data).filter(r => r.photo_url);
}

function populateGroupFilter(data) {
  const sel = document.getElementById('groupFilter');
  const counts = new Map();
  for (const r of data) {
    if (!r.group) continue;
    counts.set(r.group, (counts.get(r.group) || 0) + 1);
  }
  const groups = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  sel.innerHTML = `<option value="">All groups (${data.length})</option>`;
  for (const [g, count] of groups) {
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = `${g} (${count})`;
    sel.appendChild(opt);
  }
}

function sortValue(r, col) {
  if (col === 'common_name') return r.common_name || r.scientific_name || '';
  return r[col] ?? '';
}

function sortRows(data, col, dir, numeric) {
  const mult = dir === 'asc' ? 1 : -1;
  return [...data].sort((a, b) => {
    let av = sortValue(a, col), bv = sortValue(b, col);
    if (numeric) { av = parseFloat(av) || 0; bv = parseFloat(bv) || 0; return (av - bv) * mult; }
    return String(av).localeCompare(String(bv)) * mult;
  });
}

function renderHead() {
  const headRow = document.getElementById('headRow');
  headRow.innerHTML = '';
  for (const col of CONFIG.columns) {
    const th = document.createElement('th');
    const label = CONFIG.labels[col] ?? (col.charAt(0).toUpperCase() + col.slice(1).replace(/_/g, ' '));
    th.dataset.col = col;
    th.innerHTML = label + (sortState.col === col ? `<span class="arrow">${sortState.dir === 'asc' ? '▲' : '▼'}</span>` : '');
    th.addEventListener('click', () => {
      sortState = { col, dir: sortState.col === col && sortState.dir === 'asc' ? 'desc' : 'asc' };
      renderBody();
      renderHead();
    });
    headRow.appendChild(th);
  }
}

function filteredRows() {
  const group = document.getElementById('groupFilter').value;
  return group ? rows.filter(r => r.group === group) : rows;
}

function parseGpx(xml) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  return [...doc.getElementsByTagName('trkpt')].map(el => [
    parseFloat(el.getAttribute('lat')),
    parseFloat(el.getAttribute('lon')),
  ]).filter(([lat, lon]) => Number.isFinite(lat) && Number.isFinite(lon));
}

function mappable(r) {
  if (r.coords_obscured === 'yes') return false;
  return Number.isFinite(parseFloat(r.lat)) && Number.isFinite(parseFloat(r.lon));
}

function popupHtml(r) {
  const name = CONFIG.render.common_name(r.common_name, r);
  const img = r.photo_url ? `<img src="${esc(r.photo_url)}" alt="">` : '';
  const link = CONFIG.render.obs_url(r.obs_url);
  return `${img}<div class="popup-name">${name}</div>${link}`;
}

function renderMarkers() {
  if (!map || !markersLayer) return;
  markersLayer.clearLayers();
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2f6b3a';
  const pts = [];
  for (const r of filteredRows()) {
    if (!mappable(r)) continue;
    const latlng = [parseFloat(r.lat), parseFloat(r.lon)];
    L.circleMarker(latlng, {
      radius: 6,
      color: '#fff',
      weight: 1,
      fillColor: accent,
      fillOpacity: 0.9,
    }).bindPopup(popupHtml(r), { maxWidth: 220 }).addTo(markersLayer);
    pts.push(latlng);
  }
  const b = L.latLngBounds(routeLatLngs && routeLatLngs.length ? routeLatLngs : pts);
  for (const p of pts) b.extend(p);
  if (b.isValid()) map.fitBounds(b, { padding: [24, 24] });
}

async function initMap() {
  map = L.map('map', { scrollWheelZoom: true, maxZoom: 19 }).setView([22.33, 103.84], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(map);

  markersLayer = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 });
  map.addLayer(markersLayer);

  const xml = await fetch(CONFIG.gpx).then(r => r.text());
  routeLatLngs = parseGpx(xml);
  L.polyline(routeLatLngs, { color: '#d97706', weight: 3, opacity: 0.95 }).addTo(map);
  if (routeLatLngs.length) {
    L.circleMarker(routeLatLngs[0], {
      radius: 7, color: '#14532d', fillColor: '#22c55e', fillOpacity: 1, weight: 2,
    }).bindTooltip('Start').addTo(map);
    L.circleMarker(routeLatLngs[routeLatLngs.length - 1], {
      radius: 7, color: '#7f1d1d', fillColor: '#ef4444', fillOpacity: 1, weight: 2,
    }).bindTooltip('Finish').addTo(map);
  }

  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = () => {
    const d = L.DomUtil.create('div', 'map-legend');
    d.innerHTML = '<span><i style="background:#d97706"></i>Route</span><span><i class="dot" style="background:var(--accent)"></i>Species</span>';
    return d;
  };
  legend.addTo(map);

  renderMarkers();
  map.invalidateSize();
}

function setView(next) {
  view = next;
  const isMap = next === 'map';
  document.getElementById('tableView').hidden = isMap;
  document.getElementById('mapView').hidden = !isMap;
  document.getElementById('viewTable').classList.toggle('active', !isMap);
  document.getElementById('viewMap').classList.toggle('active', isMap);
  document.getElementById('viewTable').setAttribute('aria-pressed', String(!isMap));
  document.getElementById('viewMap').setAttribute('aria-pressed', String(isMap));
  if (isMap) {
    if (!mapReady) mapReady = initMap();
    mapReady.then(() => { map.invalidateSize(); renderMarkers(); });
  }
}

function renderBody() {
  let data = filteredRows();
  if (sortState.col) {
    data = sortRows(data, sortState.col, sortState.dir, sortState.numeric);
  }

  const body = document.getElementById('body');
  const empty = document.getElementById('empty');
  body.innerHTML = '';
  document.getElementById('count').textContent = `${data.length.toLocaleString()} / ${rows.length.toLocaleString()} rows`;
  if (view === 'map') renderMarkers();

  if (!data.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const frag = document.createDocumentFragment();
  for (const r of data) {
    const tr = document.createElement('tr');
    for (const col of CONFIG.columns) {
      const td = document.createElement('td');
      const renderer = CONFIG.render[col];
      td.innerHTML = renderer ? renderer(r[col], r) : esc(r[col]);
      tr.appendChild(td);
    }
    frag.appendChild(tr);
  }
  body.appendChild(frag);
}

async function init() {
  rows = await loadDataset();
  populateGroupFilter(rows);
  renderHead();
  renderBody();
}

document.getElementById('groupFilter').addEventListener('change', renderBody);
document.getElementById('viewTable').addEventListener('click', () => setView('table'));
document.getElementById('viewMap').addEventListener('click', () => setView('map'));

init();
</script>
</body>
</html>
